description: Interface authentication.
type: object
properties:
  type:
    type: string
    enum:
    - plaintext
    - md5
  password:
    type: string
    pattern: ^[!-~]{1,16}$
  key-id:
    description: Key ID for MD5 authentication.
    type: integer
    minimum: 1
    maximum: 255
if:
  properties:
    type:
      const: plaintext
  required:
  - type
then:
  properties:
    password:
      maxLength: 8
