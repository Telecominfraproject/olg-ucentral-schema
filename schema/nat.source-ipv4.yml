description: IPv4 Source NAT rule (SNAT/Masquerade).
type: object
properties:
  rule-number:
    description: Rule number for ordering (lower numbers processed first).
    type: integer
    minimum: 1
  outbound-interface:
    description: Outbound interface for NAT.
    type: string
    pattern: ^[A-Za-z][A-Za-z0-9_-]{0,11}$
  protocol:
    description: Protocol to match.
    type: string
    examples:
    - tcp
    - udp
    - icmp
    - all
  source:
    $ref: https://ucentral.io/schema/v1/nat/source-ipv4/source/
  destination:
    $ref: https://ucentral.io/schema/v1/nat/source-ipv4/destination/
  translation:
    $ref: https://ucentral.io/schema/v1/nat/source-ipv4/translation/
required:
- rule-number
