type: object
properties:
  name:
    description: Name identifier for this IKE group.
    type: string
  key-exchange:
    description: IKE version to use for key exchange.
    type: string
    enum:
    - ikev1
    - ikev2
    default: ikev2
  lifetime:
    description: IKE SA lifetime in seconds.
    type: integer
    default: 28800
  proposal:
    description: An array of cryptographic proposals for IKE negotiation.
    type: array
    items:
      $ref: https://ucentral.io/schema/v1/vpn/ipsec/ike-groups/proposal/
  dead-peer-detection:
    $ref: https://ucentral.io/schema/v1/vpn/ipsec/ike-groups/dead-peer-detection/
  close-action:
    description: Action to take when the remote peer closes the connection.
    type: string
    enum:
    - none
    - start
    - hold
    default: none
required:
- name
- proposal
