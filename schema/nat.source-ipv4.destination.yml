description: Destination address/port to match.
type: object
properties:
  address:
    description: Destination IPv4 network.
    type: string
    anyOf:
    - format: uc-fw-ipv4
    - format: uc-fw-cidr4
    - format: uc-fw-ip4range
    examples:
    - '!192.168.0.9'
    - 10.28.3.0/24
    - '!10.76.5.98-10.76.5.187'
  port:
    description: Destination port or port range.
    type:
    - integer
    - string
    format: uc-portrange
    examples:
    - 80
    - 1024-65535
  group:
    $ref: https://ucentral.io/schema/v1/nat/source-ipv4/destination/group/
