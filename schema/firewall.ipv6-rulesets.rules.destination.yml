type: object
properties:
  address:
    description: IPv6 network (CIDR notation).
    type: string
    format: uc-cidr6
    example: 2001:db8::/32
  port:
    description: Destination port or port range.
    type:
    - integer
    - string
    format: uc-portrange
    examples:
    - 80
    - 1024-65535
  group:
    $ref: https://ucentral.io/schema/v1/firewall/ipv6-rulesets/rules/destination/group/
