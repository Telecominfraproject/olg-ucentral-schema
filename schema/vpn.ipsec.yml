description: IPsec VPN configuration.
type: object
properties:
  local-id:
    description: Domain name of your certificate. If this var is set, local-id defined in remote-access
      object will be ignored
    type: string
  ca-cert:
    description: Name of ca certificate stored in vyos pki. If this var is set, ca-cert defined in remote-access
      object will be ignored
    type: string
  server-cert:
    description: Name of server certificate stored in vyos pki. If this var is set, server-cert defined
      in remote-access object will be ignored
    type: string
  ike-groups:
    description: IKE (Phase 1) group definitions.
    type: array
    items:
      $ref: https://ucentral.io/schema/v1/vpn/ipsec/ike-groups/
  esp-groups:
    description: ESP (Phase 2) group definitions.
    type: array
    items:
      $ref: https://ucentral.io/schema/v1/vpn/ipsec/esp-groups/
  remote-access:
    $ref: https://ucentral.io/schema/v1/vpn/ipsec/remote-access/
  users:
    description: User configuration.
    type: array
    items:
      $ref: https://ucentral.io/schema/v1/vpn/ipsec/users/
required:
- ike-groups
- esp-groups
