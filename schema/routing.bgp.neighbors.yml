type: object
properties:
  address:
    description: Neighbor IP address.
    type: string
    format: uc-ip
  port:
    type: integer
    minimum: 1
    maximum: 65535
  remote-as:
    description: Neighbor AS number.
    type: integer
    minimum: 1
    maximum: 4294967295
  update-source:
    description: Source interface for BGP session.
    type: string
    pattern: ^([0-9.]+|[0-9A-Fa-f:.]*:[0-9A-Fa-f:.]*|[A-Za-z][A-Za-z0-9_-]{0,11})$
  passive:
    description: Only accept inbound connections.
    type: boolean
    default: false
  advertisement-interval:
    type: integer
    minimum: 0
    maximum: 600
    default: 30
  ebgp-multihop:
    description: The number of hops to reach the neighbor.
    type: integer
    minimum: 1
  password:
    description: MD5 authentication password.
    type: string
    pattern: ^[!-~]{1,80}$
  peer-params:
    type: array
    items:
      $ref: https://ucentral.io/schema/v1/routing/bgp/neighbors/peer-params/
required:
- address
- remote-as
- peer-params
