description: View configuration.
type: object
properties:
  oid:
    description: Define the source oid tree for the view.
    type: string
    pattern: ^\.?[0-9]+(\.[0-9]+)*$
  type:
    description: Type is either included or excluded.
    type: string
  viewname:
    description: View name.
    type: string
    pattern: ^[A-Za-z0-9_-]{1,32}$
