type: object
properties:
  auth-mode:
    description: This field must be set to 'credentials'
    type: string
    const: credentials
  credentials:
    description: "Array of username/password pairs for local authentication. Users must \nprovide one\
      \ of these credential pairs to gain network access through \nthe captive portal. Each credential\
      \ entry requires both username and \npassword fields for authentication validation.\n"
    type: array
    items:
      type: object
      properties:
        username:
          description: "Username for local authentication. Must be unique within the \ncredentials array\
            \ for proper authentication operation.\n"
          type: string
          examples:
          - guest001
          - visitor
          - temp_user
        password:
          description: "Password for the corresponding username. Will be stored in the device \nconfiguration\
            \ and used for authentication validation.\n"
          type: string
          examples:
          - SecurePass123
          - GuestNetwork2024!
          - TemporaryAccess456
    examples:
    - - username: guest
        password: WelcomeGuest123
      - username: visitor
        password: TempAccess456
    - - username: demo_user
        password: Demo2024Pass!
