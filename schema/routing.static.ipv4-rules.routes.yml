type: object
properties:
  action:
    type: string
    enum:
    - next-hop
    - interface
    - reject
    - blackhole
  interface:
    type: string
    pattern: ^[A-Za-z][A-Za-z0-9_-]{0,11}$
  next-hop:
    type: string
    format: ipv4
  distance:
    type: integer
    default: 1
    minimum: 1
