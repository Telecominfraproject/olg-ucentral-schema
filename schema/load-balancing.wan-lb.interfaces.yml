type: object
properties:
  name:
    type: string
    pattern: ^[A-Za-z][A-Za-z0-9_-]{0,11}$
  failure-count:
    type: integer
    default: 1
    minimum: 1
    maximum: 10
  success-count:
    type: integer
    default: 1
    minimum: 1
    maximum: 10
  failover-only:
    type: boolean
    default: false
  health-check:
    $ref: https://ucentral.io/schema/v1/load-balancing/wan-lb/interfaces/health-check/
required:
- name
- health-check
