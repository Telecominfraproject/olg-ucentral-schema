description: Matching criteria for this rule.
type: object
properties:
  source:
    $ref: https://ucentral.io/schema/v1/routing/policies/rules/match/source/
  destination:
    $ref: https://ucentral.io/schema/v1/routing/policies/rules/match/destination/
  protocol:
    description: IP protocol to match. Use "all" for all protocols and "tcp_udp" for both TCP and UDP.
    type: string
    examples:
    - tcp
    - tcp_udp
    - icmp
    - all
  conn-mark:
    description: Connection mark number to match.
    type: integer
    minimum: 1
    maximum: 2147483647
  mark:
    description: Packet mark number or range to match.
    type:
    - integer
    - string
    format: uc-portrange
    examples:
    - 11451
    - '11451'
    - 11451-11454
  inbound-interface:
    description: Match traffic arriving on this interface.
    type: string
    pattern: ^[A-Za-z][A-Za-z0-9_-]{0,11}$
