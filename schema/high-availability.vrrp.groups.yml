type: object
properties:
  name:
    type: string
    pattern: ^[A-Za-z][A-Za-z0-9_-]*$
  virtual-addresses:
    type: array
    items:
      type: string
      format: uc-cidr
  priority:
    type: integer
    minimum: 1
    maximum: 255
    default: 100
  interface:
    type: string
    pattern: ^[A-Za-z][A-Za-z0-9_-]{0,11}$
  vrid:
    description: Virtual Router ID.
    type: integer
    minimum: 1
    maximum: 255
  preempt:
    type: boolean
    default: true
required:
- name
- interface
- vrid
- virtual-addresses
